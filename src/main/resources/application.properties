spring.application.name=MoneyManagement

#spring.datasource.url=jdbc:mysql://localhost:3306/moneymanager
#spring.datasource.username=root
#spring.datasource.password=${MY_SQL_PASS}

server.servlet.context-path=/api

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Updated Email Configuration for Render
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${BRAVO_USER}
spring.mail.password=${BRAVO_PASS}
spring.mail.protocol=smtp

# Use STARTTLS for Port 2525
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.from=${BRAVO_SEND_EMAIL}
money.manager.frontend.url=${MONEY_MANAGER_FRONTEND_URL}

app.application.url=${MONEY_MANAGER_BACKEND_URL}

spring.profiles.active=prod