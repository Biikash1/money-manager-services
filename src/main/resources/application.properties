spring.application.name=MoneyManagement

#spring.datasource.url=jdbc:mysql://localhost:3306/moneymanager
#spring.datasource.username=root
#spring.datasource.password=@Bikash123#

server.servlet.context-path=/api

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Email Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=465
spring.mail.username=${BRAVO_USER}
spring.mail.password=${BRAVO_PASS}
spring.mail.protocol=smtp

# SSL Specific Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.from=${BRAVO_SEND_EMAIL}

money.manager.frontend.url=${MONEY_MANAGER_FRONTEND_URL}

app.application.url=${MONEY_MANAGER_BACKEND_URL}

spring.profiles.active=prod